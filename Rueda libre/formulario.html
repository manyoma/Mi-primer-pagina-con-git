<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Formulario del Reserva</legend>
        
        <p>
            <label for="Name">Nombre</label>
            <input type="text" id="Name" name="Name" required minlength="3">
        </p>
        <p>
            <label for="Email">Correo electrico</label>
            <input type="email" id="Email" name="Email" required>
        </p>
        <p>
            <label for="Data">Fecha</label>
            <input type="date" id="Data" name="Data" required>
        </p>
        <p>
            <label for="tipo_c">Tipo bicicleta</label>
            <select name="tipo_c" id="tipo_c">
                <option value=""> Bicicleta Electrica</option>
                <option value=""> Bicicleta de Montaña</option>
                <option value=""> Bicicleta BMX y Dirt Jump</option>
            </select>
        </p>
        <p>
            <button type="submit">Reservar</button>
        </p>
        </fieldset>
    </form>
        <a href="https://www.whatsapp.com/">Contactanos</a>
</body>
</html>
